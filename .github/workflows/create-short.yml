name: Create Viral Facts Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: viral_facts_shorts_v2

    steps:

      # =====================================================
      # 1. DOWNLOAD REPOSITORY
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. INSTALL SYSTEM TOOLS
      # =====================================================

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

          python -m pip install --upgrade pip
          python -m pip install requests piper-tts


      # =====================================================
      # 3. SHOW FILES
      # =====================================================

      - name: Check project files
        run: |
          echo "=== PROJECT ==="
          pwd

          echo ""
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort


      # =====================================================
      # 4. GENERATE A RANDOM FACT
      # =====================================================

      - name: Generate fact
        run: |
          echo "Generating random fact..."
          python generator.py

          echo ""
          echo "=== SELECTED FACT ==="
          cat work/selected.json

          echo ""
          echo "=== SCRIPT ==="
          cat work/script.txt


      # =====================================================
      # 5. FIND REAL VISUALS
      # =====================================================

      - name: Create visuals
        run: |
          echo "Searching for relevant Wikimedia visuals..."
          python make_assets.py

          echo ""
          echo "=== DOWNLOADED VISUALS ==="
          find work/images -type f -printf '%f %s bytes\n' | sort


      # =====================================================
      # 6. CHECK VISUALS
      # =====================================================

      - name: Check visuals
        run: |
          COUNT=$(find work/images -type f -name '*.jpg' | wc -l)

          echo "Found $COUNT JPG visuals."

          if [ "$COUNT" -lt 4 ]; then
            echo "ERROR: Not enough visuals."
            exit 1
          fi


      # =====================================================
      # 7. DOWNLOAD PIPER VOICE
      # =====================================================

      - name: Download Piper voice
        run: |
          mkdir -p voices

          python -m piper.download_voices \
            en_US-lessac-medium \
            --download-dir voices

          echo ""
          echo "=== VOICE FILES ==="
          find voices -type f -printf '%p %s bytes\n'


      # =====================================================
      # 8. GENERATE NARRATION
      # =====================================================

      - name: Generate narration
        run: |
          echo "Generating narration..."

          mkdir -p work

          piper \
            --model voices/en_US-lessac-medium.onnx \
            --output_file work/audio.wav \
            < work/script.txt

          echo ""
          echo "=== AUDIO ==="
          ls -lh work/audio.wav


      # =====================================================
      # 9. BUILD VISUAL SCENES
      # =====================================================

      - name: Build video scenes
        run: |
          echo "Building animated scenes..."

          python build_video.py

          echo ""
          echo "=== GENERATED VIDEO FILES ==="
          find work -maxdepth 1 -type f -printf '%f %s bytes\n' | sort


      # =====================================================
      # 10. RENDER FINAL SHORT
      # =====================================================

      - name: Render final video
        run: |
          echo "Rendering final Short..."

          chmod +x render.sh

          ./render.sh

          echo ""
          echo "=== FINAL OUTPUT ==="

          if [ -f work/viral-fact-short.mp4 ]; then
            ls -lh work/viral-fact-short.mp4
          else
            echo "ERROR: Final video was not created."
            exit 1
          fi


      # =====================================================
      # 11. VERIFY VIDEO
      # =====================================================

      - name: Verify final video
        run: |
          echo "Checking final video..."

          if [ ! -f work/viral-fact-short.mp4 ]; then
            echo "ERROR: viral-fact-short.mp4 does not exist."
            exit 1
          fi

          if [ ! -s work/viral-fact-short.mp4 ]; then
            echo "ERROR: viral-fact-short.mp4 is empty."
            exit 1
          fi

          echo ""
          echo "=== FILE SIZE ==="
          ls -lh work/viral-fact-short.mp4

          echo ""
          echo "=== VIDEO INFORMATION ==="

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            work/viral-fact-short.mp4

          echo ""
          echo "VIDEO SUCCESSFULLY CREATED."


      # =====================================================
      # 12. UPLOAD VIDEO
      # =====================================================

      - name: Save Short
        uses: actions/upload-artifact@v4
        with:
          name: viral-fact-short
          path: viral_facts_shorts_v2/work/viral-fact-short.mp4
          if-no-files-found: error
          retention-days: 7
