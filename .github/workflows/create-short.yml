name: Final Viral Facts Shorts Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: viral_facts_shorts_v2

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests piper-tts


      - name: Discover random internet fact
        run: |
          python generator.py


      - name: Download Piper voice
        run: |
          mkdir -p voices

          python -m piper.download_voices \
            en_US-lessac-medium \
            --download-dir voices


      - name: Generate narration
        run: |
          piper \
            --model voices/en_US-lessac-medium.onnx \
            --output_file work/audio.wav \
            < work/script.txt


      - name: Find real visuals
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python make_assets.py


      - name: Build final Short
        run: |
          python build_video.py


      - name: Verify video
        run: |
          test -s work/viral-fact-short.mp4

          ffprobe \
            -v error \
            -show_entries stream=width,height,duration \
            -of default=noprint_wrappers=1 \
            work/viral-fact-short.mp4


      - name: Upload final Short
        uses: actions/upload-artifact@v4

        with:
          name: final-viral-short

          path: viral_facts_shorts_final/work/viral-fact-short.mp4

          if-no-files-found: error
