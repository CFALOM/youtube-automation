```yaml
name: AI Long Video Generator

on:
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Make render script executable
        run: chmod +x viral_facts_long_v1/render.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests

      - name: Generate video
        working-directory: viral_facts_long_v1
        run: ./render.sh all

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: generated-long-video
          path: viral_facts_long_v1/work/final.mp4
          if-no-files-found: error
```
