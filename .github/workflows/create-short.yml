name: AI Viral Facts Shorts Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: viral_facts_shorts_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Generate fact and script
        run: python generator.py

      - name: Generate assets
        run: python make_assets.py

      - name: Download Piper voice
        run: |
          mkdir -p voices
          python -m piper.download_voices en_US-lessac-medium --download-dir voices

      - name: Build video
        run: python build_video.py

      - name: Render final video
        run: |
          chmod +x render.sh
          ./render.sh

      - name: Show generated files
        run: |
          echo "===== GENERATED FILES ====="
          find . -maxdepth 4 -type f | sort

      - name: Save Short
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: viral_facts_shorts_v2/**/*.mp4
          if-no-files-found: error
