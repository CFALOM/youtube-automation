name: Generate Viral Fact Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: viral_facts_shorts_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check files
        run: |
          echo "Checking project..."
          ls -la
          echo ""
          echo "Python files:"
          find . -maxdepth 2 -name "*.py" -print
          echo ""
          test -f generator.py
          test -f make_assets.py
          test -f build_video.py
          test -f render.sh
          echo "All required files exist."

      - name: Generate fact and script
        run: |
          rm -rf work
          mkdir -p work
          python generator.py

      - name: Show generated fact
        run: |
          echo "========================================"
          echo "GENERATED FACT"
          echo "========================================"
          cat work/selected.json
          echo ""
          echo "========================================"
          echo "SCRIPT"
          echo "========================================"
          cat work/script.txt

      - name: Download visuals
        run: |
          python make_assets.py

      - name: Check visuals
        run: |
          echo "========================================"
          echo "VISUALS"
          echo "========================================"

          if [ ! -d work/images ]; then
            echo "ERROR: work/images does not exist"
            exit 1
          fi

          COUNT=$(find work/images -type f | wc -l)

          echo "Images found: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No visuals downloaded."
            exit 1
          fi

          find work/images -maxdepth 1 -type f -print

      - name: Generate voice
        run: |
          if [ ! -f work/audio.wav ]; then
            echo "Generating narration..."
            bash render.sh
          else
            echo "audio.wav already exists."
          fi

      - name: Check audio
        run: |
          if [ ! -s work/audio.wav ]; then
            echo "ERROR: audio.wav is missing or empty."
            exit 1
          fi

          ls -lh work/audio.wav

      - name: Build video
        run: |
          python build_video.py

      - name: Check final video
        run: |
          echo "========================================"
          echo "FINAL VIDEO"
          echo "========================================"

          if [ ! -s work/viral-fact-short.mp4 ]; then
            echo "ERROR: Final MP4 was not created."
            echo ""
            echo "Contents of work:"
            find work -maxdepth 3 -type f -print
            exit 1
          fi

          ls -lh work/viral-fact-short.mp4

          echo "Video successfully created."

      - name: Upload Short
        uses: actions/upload-artifact@v4
        with:
          name: viral-fact-short
          path: viral_facts_shorts_v2/work/viral-fact-short.mp4
          if-no-files-found: error
          retention-days: 7
