name: Generate Viral Fact Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: viral_facts_shorts_v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check project files
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          ls -la

          test -f generator.py
          test -f make_assets.py
          test -f build_video.py
          test -f render.sh

          echo "All required files found."

      - name: Generate fact
        run: |
          rm -rf work
          mkdir -p work

          python generator.py

      - name: Show generated script
        run: |
          echo "========================================"
          echo "GENERATED SCRIPT"
          echo "========================================"

          cat work/script.txt

          echo ""
          echo "========================================"
          echo "SELECTED FACT"
          echo "========================================"

          cat work/selected.json

      - name: Find visuals
        run: |
          python make_assets.py

      - name: Check visuals
        run: |
          echo "========================================"
          echo "VISUALS"
          echo "========================================"

          if [ ! -d work/images ]; then
            echo "ERROR: work/images does not exist."
            exit 1
          fi

          COUNT=$(find work/images -type f | wc -l)

          echo "Visual files: $COUNT"

          find work/images -maxdepth 1 -type f -print

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No visuals were downloaded."
            exit 1
          fi

      - name: Generate narration
        run: |
          echo "========================================"
          echo "NARRATION"
          echo "========================================"

          bash render.sh

      - name: Check audio
        run: |
          if [ ! -s work/audio.wav ]; then
            echo "ERROR: audio.wav was not created."
            echo ""
            echo "WORK DIRECTORY:"
            find work -maxdepth 2 -type f -print
            exit 1
          fi

          ls -lh work/audio.wav

      - name: Build video
        run: |
          echo "========================================"
          echo "BUILDING SHORT"
          echo "========================================"

          python build_video.py

      - name: Check final video
        run: |
          echo "========================================"
          echo "FINAL VIDEO"
          echo "========================================"

          if [ ! -s work/viral-fact-short.mp4 ]; then
            echo "ERROR: viral-fact-short.mp4 was not created."
            echo ""
            echo "WORK DIRECTORY:"
            find work -maxdepth 3 -type f -print
            exit 1
          fi

          ls -lh work/viral-fact-short.mp4

          echo "SUCCESS: Short created."

      - name: Upload Short
        uses: actions/upload-artifact@v4
        with:
          name: viral-fact-short
          path: viral_facts_shorts_v2/work/viral-fact-short.mp4
          if-no-files-found: error
          retention-days: 7
