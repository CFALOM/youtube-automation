name: Create Viral Facts Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: viral_facts_shorts_v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Generate fact and script
        run: python generator.py

      - name: Create visuals
        run: python make_scenes.py

- name: Generate voice
  run: |
    mkdir -p work/audio
    piper.download_voices
    piper --model en_US-lessac-medium \
      --output_file work/audio/narration.wav \
      < work/script.txt

      - name: Render video
        run: |
          chmod +x render.sh
          ./render.sh

      - name: Add narration
        run: |
          ffmpeg -y \
            -i work/video_no_audio.mp4 \
            -i work/audio/narration.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -shortest \
            work/viral-fact-short.mp4

      - name: Save Short
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: viral_facts_shorts_v1/work/viral-fact-short.mp4
